<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Suabelo Resina Botánica. Interfaz de idioma QR para descripción de productos y creación">
        <meta name="author" content="[T] Adrián Díaz García">
        <title>Selección de Idioma - Suabelo Resina Botánica</title>

        <link rel="stylesheet" href="assets/css/estilos.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <header>
            <img src="assets/img/Suabelo_LOGO.png" alt="Logo_de_Suabelo" class="logo">
        </header> 

        <main>
            <section class="hero-tienda">
                <h2>Elige tu idioma.</h2>
            </section>
            <section class="tienda-galeria">
                <div class="producto-card">
                    <img src="assets/img/bandera-espana.jpg" alt="Bandera de España">
                    <h3>Español</h3>
                    <a href="tienda.html" class="boton-cta">Ver</a>
                </div>

                <div class="producto-card">
                    <img src="img/pendientes-helecho.jpg" alt="Pendientes con mini helecho">
                    <h3>Pendientes Bosque</h3>
                    <p>Resina y plata de ley</p>
                    <a href="tienda.html" class="boton-cta">Ver en Tienda</a>
                </div>

                <div class="producto-card">
                    <img src="img/anillo-margarita.webp" alt="Anillo con margarita encapsulada">
                    <h3>Anillo Sol</h3>
                    <p>Resina de alta transparencia</p>
                    <a href="tienda.html" class="boton-cta">Ver en Tienda</a>
                </div>
            </section>

            <a href="tienda.html" class="boton-cta">Explorar Tienda</a>
        </main>
        
        <footer>
            <div class="footer-container">
                <div class="footer-logo">
                    <p>
                        &copy; 2026 Desarrollado por <strong>Adrián Díaz García</strong>.
                    </p>
                </div>
                
                <div class="footer-links">
                    <ul>
                        <li><a href="#">Aviso Legal</a></li>
                        <li><a href="#">Política de Cookies</a></li>
                        <li><a href="#">Términos</a></li>
                    </ul>
                </div>
                
                <div class="footer-social">
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </footer>
        <script src="js/carrito.js"></script>
    </body>
</html>
